[package]
name = "engram"
version = "0.1.0"
edition = "2021"

[dependencies]
blake3 = "1.8.7"
ignore = "0.4.33"
regex = "1.13.1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tree-sitter = "0.25"
tree-sitter-python = "0.25"
